name: Update YouTube Videos

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch YouTube RSS
        env:
          YOUTUBE_CHANNEL_ID: "UC7mITELaslVm48b-gu-X_PA"
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          channel_id = os.environ["YOUTUBE_CHANNEL_ID"].strip()

          if not channel_id.startswith("UC"):
              raise Exception(
                  "Invalid YouTube Channel ID. "
                  "It must start with UC."
              )

          rss_url = (
              "https://www.youtube.com/feeds/videos.xml"
              "?channel_id=" + channel_id
          )

          print("Fetching:", rss_url)

          request = urllib.request.Request(
              rss_url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              xml_data = response.read()

          root = ET.fromstring(xml_data)

          ns = {
              "atom": "http://www.w3.org/2005/Atom",
              "yt": "http://www.youtube.com/xml/schemas/2015"
          }

          videos = []

          for entry in root.findall("atom:entry", ns):

              video_id = entry.find("yt:videoId", ns)
              title = entry.find("atom:title", ns)
              published = entry.find("atom:published", ns)

              if video_id is None:
                  continue

              vid = video_id.text.strip()

              videos.append({
                  "id": vid,
                  "title": title.text.strip() if title is not None else "",
                  "published": published.text.strip() if published is not None else "",
                  "thumbnail": f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg",
                  "url": f"https://www.youtube.com/watch?v={vid}"
              })

          with open("videos.json", "w", encoding="utf-8") as file:
              json.dump(
                  videos,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"Successfully found {len(videos)} videos.")
          PY

      - name: Commit videos.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update YouTube videos"
            git push
          fi
