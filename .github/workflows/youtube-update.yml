name: Update YouTube Videos

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update YouTube videos
        env:
          YOUTUBE_CHANNEL_URL: "https://youtube.com/@slblackshadowking?si=dXpIT6r2WXO2yVmr"
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          channel_url = os.environ[["YOUTUBE_CHANNEL_URL"]

          # Get channel page
          req = urllib.request.Request(
              channel_url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          html = urllib.request.urlopen(req, timeout=20).read().decode("utf-8", "ignore")

          # Find channel ID
          match = re.search(r'"channelId":"(UC[a-zA-Z0-9_-]+)"', html)

          if not match:
              raise Exception("Could not find YouTube Channel ID.")

          channel_id = match.group(1)

          # YouTube public RSS feed
          rss_url = (
              "https://www.youtube.com/feeds/videos.xml"
              "?channel_id=" + channel_id
          )

          req = urllib.request.Request(
              rss_url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          xml_data = urllib.request.urlopen(req, timeout=20).read()

          root = ET.fromstring(xml_data)

          ns = {
              "atom": "http://www.w3.org/2005/Atom",
              "yt": "http://www.youtube.com/xml/schemas/2015"
          }

          videos = []

          for entry in root.findall("atom:entry", ns):
              video_id = entry.find("yt:videoId", ns)
              title = entry.find("atom:title", ns)
              published = entry.find("atom:published", ns)

              if video_id is None:
                  continue

              vid = video_id.text

              videos.append({
                  "id": vid,
                  "title": title.text if title is not None else "",
                  "published": published.text if published is not None else "",
                  "thumbnail": f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg",
                  "url": f"https://www.youtube.com/watch?v={vid}"
              })

          with open("videos.json", "w", encoding="utf-8") as f:
              json.dump(videos, f, ensure_ascii=False, indent=2)

          print(f"Updated {len(videos)} videos.")
          PY

      - name: Commit updated videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto update YouTube videos"
            git push
          fi
